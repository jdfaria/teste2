// --- From context/AppContext.tsx ---
const initialState = {
  currentPage: 1,
  scores: {
    personalData: null,
    detectRisk: null,
    matchPitfalls: null,
    quiz: null,
  },
  completedActivities: {},
};

const appReducer = (state, action) => {
  switch (action.type) {
    case 'NEXT_PAGE':
      return { ...state, currentPage: Math.min(state.currentPage + 1, 11) };
    case 'PREV_PAGE':
      return { ...state, currentPage: Math.max(state.currentPage - 1, 1) };
    case 'SET_PAGE':
        return { ...state, currentPage: action.payload };
    case 'SET_SCORE':
      return {
        ...state,
        scores: { ...state.scores, [action.payload.activity]: action.payload.score },
      };
    case 'COMPLETE_ACTIVITY':
        return {
            ...state,
            completedActivities: { ...state.completedActivities, [action.payload]: true }
        }
    default:
      return state;
  }
};

const AppContext = createContext({
  state: initialState,
  dispatch: () => null,
});

const AppProvider = ({ children }) => {
  const [state, dispatch] = useReducer(appReducer, initialState);

  return (
    <AppContext.Provider value={{ state, dispatch }}>
      {children}
    </AppContext.Provider>
  );
};

// --- From components/pages/Page2_ActivityPersonalData.tsx ---
const Page2ActivityPersonalData = () => {
  const { state, dispatch } = useContext(AppContext);
  const isCompleted = state.completedActivities['personalData'];

  const [columns, setColumns] = useState({
    items: { id: 'items', title: 'Itens', items: PERSONAL_DATA_ITEMS },
    personal: { id: 'personal', title: 'Dados Pessoais', items: [] },
    notPersonal: { id: 'notPersonal', title: 'Não São Dados Pessoais', items: [] },
  });
  const [draggedItem, setDraggedItem] = useState(null);
  const [score, setScore] = useState(null);

  const handleDragStart = (e, item, sourceColId) => {
    if (isCompleted) return;
    setDraggedItem(item);
    e.dataTransfer.setData('text/plain', item.id);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleDrop = (e, targetColId) => {
    e.preventDefault();
    if (!draggedItem || isCompleted) return;

    let sourceColId = '';
    for (const colId in columns) {
        if (columns[colId].items.some(i => i.id === draggedItem.id)) {
            sourceColId = colId;
            break;
        }
    }

    if (sourceColId === targetColId) return;

    const newColumns = { ...columns };
    newColumns[sourceColId].items = newColumns[sourceColId].items.filter(i => i.id !== draggedItem.id);
    newColumns[targetColId].items = [...newColumns[targetColId].items, draggedItem];

    setColumns(newColumns);
    setDraggedItem(null);
  };
  
  const handleDragOver = (e) => {
    e.preventDefault();
  };

  const checkAnswers = () => {
    let correctCount = 0;
    columns.personal.items.forEach(item => {
      if (item.isPersonal) correctCount++;
    });
    columns.notPersonal.items.forEach(item => {
      if (!item.isPersonal) correctCount++;
    });
    setScore(correctCount);
    dispatch({ type: 'SET_SCORE', payload: { activity: 'personalData', score: correctCount } });
    dispatch({ type: 'COMPLETE_ACTIVITY', payload: 'personalData' });
  };
  
  return (
    <div className="w-full max-w-6xl bg-white rounded-lg shadow-lg p-6 md:p-10">
      <h2 className="text-2xl font-bold text-red-500 mb-2">Atividade: O que são Dados Pessoais?</h2>
      <p className="text-gray-600 mb-6">Arrasta cada item para a caixa correta para testar os teus conhecimentos.</p>
      
      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
        {Object.values(columns).map(col => (
          <div 
            key={col.id}
            onDrop={(e) => handleDrop(e, col.id)}
            onDragOver={handleDragOver}
            className={`border-2 border-dashed rounded-lg p-4 min-h-[300px] ${isCompleted ? 'bg-gray-100' : 'bg-gray-50'}`}
          >
            <h3 className="font-bold text-center text-gray-700 mb-4">{col.title}</h3>
            <div className="space-y-2">
              {col.items.map(item => (
                <div
                  key={item.id}
                  draggable={!isCompleted}
                  onDragStart={(e) => handleDragStart(e, item, col.id)}
                  className={`p-3 bg-white border rounded-md shadow-sm text-center ${!isCompleted ? 'cursor-move' : 'cursor-not-allowed opacity-70'}`}
                >
                  {item.content}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="text-center mt-8">
        {!isCompleted && columns.items.items.length === 0 && (
          <button onClick={checkAnswers} className="bg-teal-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors">
            Verificar Respostas
          </button>
        )}
        {isCompleted && score !== null && (
          <div className="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-r-lg inline-block">
            <p className="font-bold">Atividade Concluída!</p>
            <p>A tua pontuação: {score} de {PERSONAL_DATA_MAX_SCORE} respostas certas.</p>
          </div>
        )}
      </div>
    </div>
  );
};

// --- From components/pages/Page4_ActivityDetectRisk.tsx ---
const Page4ActivityDetectRisk = () => {
  const { state, dispatch } = useContext(AppContext);
  const isCompleted = state.completedActivities['detectRisk'];
  const [selectedPosts, setSelectedPosts] = useState([]);
  const [score, setScore] = useState(null);

  const togglePost = (id) => {
    if (isCompleted) return;
    setSelectedPosts(prev =>
      prev.includes(id) ? prev.filter(pId => pId !== id) : [...prev, id]
    );
  };

  const checkAnswers = () => {
    let correctCount = 0;
    const riskyPosts = RISK_POSTS.filter(p => p.isRisk).map(p => p.id);
    selectedPosts.forEach(id => {
      if (riskyPosts.includes(id)) {
        correctCount++;
      }
    });
    setScore(correctCount);
    dispatch({ type: 'SET_SCORE', payload: { activity: 'detectRisk', score: correctCount } });
    dispatch({ type: 'COMPLETE_ACTIVITY', payload: 'detectRisk' });
  };

  return (
    <div className="w-full max-w-4xl bg-white rounded-lg shadow-lg p-6 md:p-10">
      <h2 className="text-2xl font-bold text-red-500 mb-2">Atividade: Deteta o Risco</h2>
      <p className="text-gray-600 mb-6">Clica nas publicações que achas que partilham demasiada informação. Depois, clica em verificar.</p>
      
      <div className="space-y-4">
        {RISK_POSTS.map(post => {
          const isSelected = selectedPosts.includes(post.id);
          let borderColor = 'border-gray-200';
          if (isCompleted) {
            if (post.isRisk) borderColor = 'border-red-500';
            if (isSelected && !post.isRisk) borderColor = 'border-yellow-500';
          } else if (isSelected) {
            borderColor = 'border-blue-500';
          }

          return (
            <div
              key={post.id}
              onClick={() => togglePost(post.id)}
              className={`p-4 border-2 ${borderColor} rounded-lg ${!isCompleted ? 'cursor-pointer hover:bg-gray-50' : 'cursor-default opacity-80'} transition-all`}
            >
              <p className="font-bold text-gray-800">{post.author}</p>
              <p className="text-gray-600">{post.text}</p>
            </div>
          );
        })}
      </div>

      <div className="text-center mt-8">
        {!isCompleted ? (
          <button onClick={checkAnswers} className="bg-teal-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors">
            Verificar Respostas
          </button>
        ) : score !== null && (
          <div className="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-r-lg inline-block">
            <p className="font-bold">Atividade Concluída!</p>
            <p>A tua pontuação: {score} de {DETECT_RISK_MAX_SCORE} respostas certas.</p>
            <p className="text-sm mt-1">As publicações de risco estão destacadas a vermelho.</p>
          </div>
        )}
      </div>
    </div>
  );
};

// --- From components/pages/Page7_PasswordChecker.tsx ---
const Requirement = ({ text, met }) => (
    <li className={`flex items-center space-x-2 ${met ? 'text-green-600' : 'text-red-500'}`}>
        {met ? <CheckIcon /> : <XIcon />}
        <span>{text}</span>
    </li>
);

const Page7PasswordChecker = () => {
    const [password, setPassword] = useState('');

    const checks = useMemo(() => {
        return {
            length: password.length >= 9,
            lowercase: /[a-z]/.test(password),
            uppercase: /[A-Z]/.test(password),
            number: /[0-9]/.test(password),
            special: /[^a-zA-Z0-9]/.test(password),
        };
    }, [password]);

    const strength = useMemo(() => {
        const metCount = Object.values(checks).filter(Boolean).length;
        if (metCount < 3) return { text: 'Muito Fraca', color: 'bg-red-500' };
        if (metCount === 3) return { text: 'Fraca', color: 'bg-orange-500' };
        if (metCount === 4) return { text: 'Média', color: 'bg-yellow-500' };
        return { text: 'Forte', color: 'bg-green-500' };
    }, [checks]);

    return (
        <PageContainer>
            <div className="text-left max-w-2xl mx-auto">
                <h2 className="text-3xl font-bold text-red-500 mb-8 text-center">Verificador de Força da Palavra-passe</h2>
                <div className="bg-gray-50 p-6 rounded-lg shadow">
                    <label htmlFor="password-input" className="font-semibold text-gray-700">Escreve uma palavra-passe para testar a sua força:</label>
                    <input
                        id="password-input"
                        type="text"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="A tua palavra-passe aqui..."
                        className="w-full p-3 border border-gray-300 rounded-md mt-2 mb-6 bg-white text-black"
                    />
                    <div className="grid md:grid-cols-2 gap-6">
                        <ul className="space-y-2">
                            <Requirement text="Pelo menos 9 caracteres" met={checks.length} />
                            <Requirement text="Letra minúscula (a-z)" met={checks.lowercase} />
                            <Requirement text="Letra maiúscula (A-Z)" met={checks.uppercase} />
                            <Requirement text="Número (0-9)" met={checks.number} />
                            <Requirement text="Caractere especial (!@#...)" met={checks.special} />
                        </ul>
                        <div className="flex items-center justify-center">
                            <div className={`text-white font-bold py-2 px-6 rounded-lg ${strength.color}`}>
                                Força: {strength.text}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </PageContainer>
    );
};

// --- From components/pages/Page9_ActivityMatchPitfalls.tsx ---
const Page9ActivityMatchPitfalls = () => {
  const { state, dispatch } = useContext(AppContext);
  const isCompleted = state.completedActivities['matchPitfalls'];

  const [passwords, setPasswords] = useState(PASSWORD_PITFALL_ITEMS.passwords);
  const [placedPasswords, setPlacedPasswords] = useState([]);
  const [draggedItem, setDraggedItem] = useState(null);
  const [score, setScore] = useState(null);

  const handleDragStart = (e, item) => {
    if (isCompleted) return;
    setDraggedItem(item);
  };

  const handleDrop = (e, categoryId) => {
    e.preventDefault();
    if (!draggedItem || isCompleted) return;

    setPasswords(passwords.filter(p => p.id !== draggedItem.id));
    setPlacedPasswords([...placedPasswords, { ...draggedItem, placedInCategory: categoryId }]);
    setDraggedItem(null);
  };

  const handleDragOver = (e) => e.preventDefault();

  const checkAnswers = () => {
    let correctCount = 0;
    placedPasswords.forEach(placed => {
      const category = PASSWORD_PITFALL_ITEMS.categories.find(c => c.id === placed.placedInCategory);
      if (category && category.correctPasswordIds.includes(placed.id)) {
        correctCount++;
      }
    });
    setScore(correctCount);
    dispatch({ type: 'SET_SCORE', payload: { activity: 'matchPitfalls', score: correctCount } });
    dispatch({ type: 'COMPLETE_ACTIVITY', payload: 'matchPitfalls' });
  };
  
  return (
    <div className="w-full max-w-6xl bg-white rounded-lg shadow-lg p-6 md:p-10">
      <h2 className="text-2xl font-bold text-red-500 mb-2">Atividade: Combina as Armadilhas</h2>
      <p className="text-gray-600 mb-6">Arrasta cada password para o erro que ela representa. Depois, verifica as tuas respostas.</p>
      
      <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
        {/* Passwords Column */}
        <div className={`border-2 border-dashed rounded-lg p-4 min-h-[300px] ${isCompleted ? 'bg-gray-100' : 'bg-gray-50'}`}>
          <h3 className="font-bold text-center text-gray-700 mb-4">Passwords Fracas</h3>
          <div className="space-y-2">
            {passwords.map(item => (
              <div
                key={item.id}
                draggable={!isCompleted}
                onDragStart={(e) => handleDragStart(e, item)}
                className={`p-3 bg-white border rounded-md shadow-sm text-center font-mono ${!isCompleted ? 'cursor-move' : 'cursor-not-allowed opacity-70'}`}
              >
                {item.content}
              </div>
            ))}
          </div>
        </div>
        
        {/* Categories Column */}
        <div className="space-y-4">
          {PASSWORD_PITFALL_ITEMS.categories.map(cat => (
            <div 
              key={cat.id}
              onDrop={(e) => handleDrop(e, cat.id)}
              onDragOver={handleDragOver}
              className={`border-2 border-dashed rounded-lg p-4 min-h-[100px] ${isCompleted ? 'bg-gray-100' : 'bg-gray-50'}`}
            >
              <h3 className="font-bold text-center text-gray-700 mb-4">{cat.title}</h3>
              <div className="flex flex-wrap gap-2 justify-center">
                {placedPasswords.filter(p => p.placedInCategory === cat.id).map(item => (
                  <div key={item.id} className="p-2 bg-white border rounded-md shadow-sm font-mono">
                    {item.content}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="text-center mt-8">
        {!isCompleted && passwords.length === 0 ? (
          <button onClick={checkAnswers} className="bg-teal-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors">
            Verificar Respostas
          </button>
        ) : isCompleted && score !== null && (
          <div className="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-r-lg inline-block">
            <p className="font-bold">Atividade Concluída!</p>
            <p>A tua pontuação: {score} de {MATCH_PITFALLS_MAX_SCORE} respostas certas.</p>
          </div>
        )}
      </div>
    </div>
  );
};

// --- From components/pages/Page10_Quiz.tsx ---
const Page10Quiz = () => {
  const { state, dispatch } = useContext(AppContext);
  const isCompleted = state.completedActivities['quiz'];

  const [currentQuestion, setCurrentQuestion] = useState(0);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [showFeedback, setShowFeedback] = useState(false);
  const [score, setScore] = useState(0);
  const [quizFinished, setQuizFinished] = useState(false);

  const handleAnswer = (optionIndex) => {
    if (showFeedback || isCompleted) return;
    setSelectedAnswer(optionIndex);
    if (optionIndex === QUIZ_QUESTIONS[currentQuestion].correct) {
      setScore(s => s + 1);
    }
    setShowFeedback(true);
  };

  const handleNext = () => {
    if (currentQuestion < QUIZ_QUESTIONS.length - 1) {
      setCurrentQuestion(q => q + 1);
      setSelectedAnswer(null);
      setShowFeedback(false);
    } else {
      setQuizFinished(true);
      dispatch({ type: 'SET_SCORE', payload: { activity: 'quiz', score: score } });
      dispatch({ type: 'COMPLETE_ACTIVITY', payload: 'quiz' });
    }
  };

  const questionData = QUIZ_QUESTIONS[currentQuestion];

  return (
    <div className="w-full max-w-4xl bg-white rounded-lg shadow-lg p-6 md:p-10">
      <h2 className="text-2xl font-bold text-red-500 mb-2">Atividade: Qual é mais segura?</h2>
      
      {isCompleted || quizFinished ? (
        <div className="text-center py-10">
            <h3 className="text-2xl font-bold text-gray-800">Quiz Terminado!</h3>
            <p className="text-lg text-gray-600 mt-2">A tua pontuação final: {state.scores.quiz || score} / {QUIZ_MAX_SCORE}</p>
            <p className="text-gray-500 mt-4">Podes avançar para o teu certificado.</p>
        </div>
      ) : (
        <>
            <p className="text-gray-600 mb-6">Pergunta {currentQuestion + 1} de {QUIZ_QUESTIONS.length}</p>
            <p className="font-semibold text-lg text-gray-700 mb-6">{questionData.question}</p>
            
            <div className="grid md:grid-cols-2 gap-4">
                {questionData.options.map((option, index) => {
                    let buttonClass = 'border-gray-300 hover:border-teal-500 hover:bg-teal-50';
                    if (showFeedback) {
                        if (index === questionData.correct) {
                            buttonClass = 'border-green-500 bg-green-100 text-green-800';
                        } else if (index === selectedAnswer) {
                            buttonClass = 'border-red-500 bg-red-100 text-red-800';
                        }
                    }
                    return (
                        <button
                            key={index}
                            onClick={() => handleAnswer(index)}
                            disabled={showFeedback}
                            className={`p-4 border-2 rounded-lg font-mono text-center transition-all ${buttonClass}`}
                        >
                            {option}
                        </button>
                    );
                })}
            </div>
            
            {showFeedback && (
                <div className="mt-6 text-center">
                    <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg inline-block text-left max-w-xl">
                        <p className="text-gray-700">{questionData.explanation}</p>
                    </div>
                    <button onClick={handleNext} className="mt-6 bg-teal-600 text-white px-8 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-colors">
                        {currentQuestion < QUIZ_QUESTIONS.length - 1 ? 'Próxima Pergunta' : 'Finalizar Quiz'}
                    </button>
                </div>
            )}
        </>
      )}
    </div>
  );
};

const Page11Certificate = () => {
    const { state } = useContext(AppContext);
    const [name, setName] = useState('');
    const [isDownloading, setIsDownloading] = useState(false);
    const certificateRef = useRef(null);

    const totalMaxScore = PERSONAL_DATA_MAX_SCORE + DETECT_RISK_MAX_SCORE + MATCH_PITFALLS_MAX_SCORE + QUIZ_MAX_SCORE;
    const totalUserScore = (state.scores.personalData || 0) + (state.scores.detectRisk || 0) + (state.scores.matchPitfalls || 0) + (state.scores.quiz || 0);
    const finalPercentage = totalMaxScore > 0 ? Math.round((totalUserScore / totalMaxScore) * 100) : 0;

    const downloadCertificate = () => {
        if (!certificateRef.current || isDownloading) return;

        setIsDownloading(true);
        
        html2canvas(certificateRef.current, { scale: 2, useCORS: true }).then((canvas) => {
            const imgData = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `Certificado-${name.replace(/\s/g, '_') || 'Protecao_Dados'}.png`;
            link.href = imgData;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }).catch((error) => {
            console.error("Ocorreu um erro ao descarregar o certificado:", error);
            alert("Não foi possível descarregar o certificado. Por favor, tente novamente.");
        }).finally(() => {
            setIsDownloading(false);
        });
    };

    return (
        <div className="w-full max-w-4xl">
            <h2 className="text-3xl font-bold text-red-500 mb-6">Certificado de Conclusão</h2>
            <div className="flex flex-col items-center">
                <CertificateContent ref={certificateRef} name={name} score={finalPercentage} />
                
                <div className="mt-8 bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
                    <h3 className="font-bold text-lg text-gray-800">Personalize e Descarregue o seu Certificado</h3>
                    <label htmlFor="name-input" className="block mt-4 mb-1 text-sm font-medium text-gray-600">Insira o seu primeiro e último nome:</label>
                    <input
                        id="name-input"
                        type="text"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        placeholder="O seu nome aqui..."
                        className="w-full p-2 border border-gray-300 rounded-md bg-white text-black"
                    />
                    <button
                        onClick={downloadCertificate}
                        disabled={isDownloading}
                        className="w-full mt-4 bg-teal-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-teal-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                    >
                        {isDownloading ? 'A descarregar...' : 'Descarregar Certificado (.png)'}
                    </button>
                </div>
            </div>
        </div>
    );
};
